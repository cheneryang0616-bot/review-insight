name: CI

# 完全离线：仓库只带脱敏样例，不依赖任何私有资产或 API Key。
# 因此这里跑的是「样例可覆盖的部分」：
#   - 全套单测（缺数据时相关用例自动 skip，不会假装通过）
#   - phm / credit 评测（样例即可跑通）
#   - review 评测（需要完整评论数据，CI 中全部 skip，退出码仍为 0）
#   - 自修正闭环评测 + 图表渲染冒烟
# 完整的 PHM Stage 1 验收（需原始序列与 model report）不在 CI 里跑，
# 用 scripts/verify_phm_stage1.py 在本地执行。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    env:
      MPLCONFIGDIR: /tmp/mplcache
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 中文字体：仅影响图表字形，装不上也不阻塞（图仍会生成）
      - name: 安装中文字体（失败不阻塞）
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk || true

      - name: 单元测试（样例数据）
        run: python -m unittest discover -s tests -v

      - name: 领域评测（离线）
        run: |
          python scripts/run_eval.py --domain phm
          python scripts/run_eval.py --domain credit
          python scripts/run_eval.py --domain review

      - name: 自修正闭环评测
        run: python scripts/run_loop_eval.py

      - name: 图表渲染冒烟
        run: |
          python scripts/make_phm_figures.py --out-dir "$RUNNER_TEMP/phm_figs"
          python - "$RUNNER_TEMP/phm_figs" <<'PY'
          import sys, pathlib
          files = sorted(pathlib.Path(sys.argv[1]).glob("*.png"))
          assert len(files) == 4, f"期望 4 张图，实际 {len(files)}"
          for f in files:
              assert f.stat().st_size > 10_000, f"{f.name} 太小，可能没画出来"
          print("图表冒烟通过：", [f.name for f in files])
          PY

      - name: 上传评测明细
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: results/*.json
          if-no-files-found: warn
